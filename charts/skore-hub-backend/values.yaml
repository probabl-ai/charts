# =============================================================================
# Default values for skore-hub-backend.
#
# This is a GENERIC, client-facing chart. Do not edit this file for a specific
# environment: copy `values.example.yaml`, adapt it, and pass it with
# `helm ... -f values.yaml`.
#
# The application is configured entirely through `SKH__*` environment variables
# (see `skh.env`, `skh.extraEnv` and `skh.envSecret` below).
# =============================================================================

replicaCount: 1

image:
  # Backend image, pulled from the Scaleway container registry provided by Probabl.
  repository: rg.fr-par.scw.cloud/probabl-skh/skh
  # Pinned to an immutable release tag, so no need to re-pull on every rollout.
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion (the shipped release) when empty.
  # Override with another version, or a tag@sha256 digest, if needed.
  tag: ""

# Pull secret(s) for the private registry (see docs: create a dockerconfigjson secret).
imagePullSecrets: []
#  - name: scw-registry

nameOverride: ""
fullnameOverride: ""

# --- Application configuration (SKH__* environment variables) -----------------
skh:
  # Name of an existing Kubernetes Secret whose keys are injected as environment
  # variables (envFrom). Put every SENSITIVE SKH__* value here (DB password,
  # OIDC client secret, S3 keys, SMTP password...).
  # Leave empty to disable envFrom (e.g. if you inject everything via extraEnv).
  envSecret: "skore-hub-backend-secrets"

  # Non-sensitive SKH__* settings, as a plain map (rendered as `name/value` env).
  env: {}
  #  SKH__ENV: "production"
  #  SKH__LOG_LEVEL: "INFO"
  #
  #  # MCP (Model Context Protocol) support for agent-harness communication.
  #  # Off by default; set true to enable MCP server endpoints.
  #  SKH__AGENT__MCP_ENABLED: "true"
  #
  #  # Skore agent (hub-side LLM orchestration, OpenAI/Anthropic-compatible on
  #  # /v1/chat/completions, /v1/messages, /v1/models). Off by default
  #  # (SKH__AGENT__BACKEND=mock). Enable with backend=anthropic + a provider.
  #  # Requires outbound egress to api.anthropic.com (or AWS Bedrock); an
  #  # air-gapped deployment with no external LLM is NOT supported yet.
  #  # See docs/03-agent-setup.md and docs/reference-configuration.md#skore-agent-agent.
  #  SKH__AGENT__BACKEND: "anthropic"
  #  SKH__AGENT__PROVIDER: "anthropic"
  #  SKH__AGENT__MANAGED_EMAILS: '["*@yourcompany.com"]'
  #  SKH__AGENT__MODEL_BIG: "claude-opus-4-8"
  #  SKH__AGENT__MODEL_NORMAL: "claude-sonnet-4-6"
  #  SKH__AGENT__MODEL_SMALL: "claude-haiku-4-5"
  #  SKH__AGENT__PUBLIC_MODEL_ID: "skore-agent"

  # Additional env entries in list form. Use this to map individual keys from
  # Secrets/ConfigMaps via valueFrom (secretKeyRef, configMapKeyRef, ...).
  extraEnv: []
  #  - name: SKH__DB__PASSWORD
  #    valueFrom:
  #      secretKeyRef:
  #        name: skore-hub-backend-secrets
  #        key: db-password
  #
  #  # Skore agent secrets: encryption key is REQUIRED for per-workspace
  #  # providers; the Anthropic key is for the Skore-managed model. For Bedrock
  #  # static creds / assume-role, add aws-access-key-id, aws-secret-access-key,
  #  # bedrock-external-id. See docs/03-agent-setup.md.
  #  - name: SKH__ENCRYPTION__KEY
  #    valueFrom:
  #      secretKeyRef:
  #        name: skore-hub-backend-secrets
  #        key: encryption-key
  #  - name: SKH__AGENT__ANTHROPIC_API_KEY
  #    valueFrom:
  #      secretKeyRef:
  #        name: skore-hub-backend-secrets
  #        key: anthropic-api-key

# Database migrations (Alembic) always run as a Helm pre-install/pre-upgrade hook
# Job (the app cannot start against an un-migrated schema).
dbMigrations:
  command: "/skh/hub/.venv/bin/alembic upgrade head"
  backoffLimit: 3
  annotations: {}
  resources: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.skore-hub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: skore-hub-api-tls
  #    hosts:
  #      - api.skore-hub.example.com

resources: {}
#  requests:
#    cpu: "1"
#    memory: 4Gi
#  limits:
#    memory: 4Gi   # no CPU limit

# Health probes. The API serves liveness/readiness on the service port.
livenessProbe:
  httpGet:
    path: /liveness
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readiness
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# Metrics are exported via OTLP push (SKH__OTEL_METRICS__*), not scraped:
# skore-hub does not expose a Prometheus /metrics endpoint.
