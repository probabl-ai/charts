apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "skore-hub.fullname" . }}-test-connection"
  labels:
    {{- include "skore-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - "--spider"
        - "-S"
        - "{{ include "skore-hub.fullname" . }}:{{ .Values.service.port }}{{ .Values.livenessProbe.httpGet.path }}"
