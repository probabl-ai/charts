apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skore-hub.fullname" . }}
  labels:
    {{- include "skore-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "skore-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.skh.config.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.skh.config.enabled }}
        checksum/skh-config: {{ include "skore-hub.configChecksum" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "skore-hub.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skore-hub.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.skh.envSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.skh.envSecret }}
          {{- end }}
          env:
            {{- include "skore-hub.configEnv" . | nindent 12 }}
            {{- include "skore-hub.env" . | nindent 12 }}
            {{- with .Values.skh.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $hasMounts := or .Values.skh.config.enabled .Values.volumeMounts }}
          {{- if $hasMounts }}
          volumeMounts:
            {{- include "skore-hub.configVolumeMount" . | nindent 12 }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- $hasVolumes := or .Values.skh.config.enabled .Values.volumes }}
      {{- if $hasVolumes }}
      volumes:
        {{- include "skore-hub.configVolume" . | nindent 8 }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
