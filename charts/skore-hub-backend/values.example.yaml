# =============================================================================
# Example values for an on-premise deployment of skore-hub-backend.
# Copy, adapt the placeholders (<...>), and deploy:
#   helm upgrade --install skore-hub ./skore-hub-backend -n skore-hub -f values.example.yaml
#
# Secrets (passwords, keys) are NOT set here: put them in the Kubernetes Secret
# referenced below and wire them via skh.extraEnv.
# =============================================================================

fullnameOverride: "skore-hub-backend"
replicaCount: 2

image:
  repository: rg.fr-par.scw.cloud/probabl-skh/skh
  # Pinned to an immutable release version. Override with another version or a
  # tag@sha256 digest if needed; use "latest" (with pullPolicy: Always) to track
  # the newest release instead.
  tag: "0.32.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: scw-registry

skh:
  # Kubernetes Secret holding the sensitive values referenced in extraEnv.
  envSecret: "skore-hub-backend-secrets"

  # Non-sensitive settings as a mounted TOML ConfigMap. The chart injects
  # `SKH_CONFIG_FILE` automatically; TOML values take priority over `SKH__*`
  # env vars. Secrets stay in `extraEnv` below — never in the ConfigMap.
  # A change here updates the ConfigMap and the `checksum/skh-config` pod
  # annotation, which rolls out the Deployment and re-runs migrations.
  config:
    enabled: true
    data: |
      # Skore Hub backend configuration (non-sensitive only).
      # Secrets live in the Kubernetes Secret referenced in `extraEnv` below.

      env = "production"
      app_name = "Skore Hub"
      ui_url = "https://skore-hub.example.com"

      log_level = "INFO"
      log_formatter = "json"

      # Database (PostgreSQL) — credentials in the Secret (extraEnv).
      [db]
      host = "postgres.internal"
      port = 5432
      name = "skore_hub"
      ssl_enabled = true

      # Identity provider (OIDC) — client id/secret in the Secret.
      [idp]
      is_enabled = true
      base_url = "https://sso.example.com/realms/skore"
      scope = "openid profile email offline_access"

      # Object storage (S3-compatible) — access/secret keys in the Secret.
      [object_storage]
      type = "s3"
      endpoint = "https://s3.internal"
      bucket_name = "skore-hub"

      # Redis — password in the Secret.
      [redis]
      is_enabled = true
      host = "redis.internal"
      port = 6379
      ssl = true

      # SMTP — user/password in the Secret.
      [smtp]
      host = "smtp.internal"
      port = 587
      use_tls = true
      sender = "no-reply@example.com"

      # Skore agent (hub-side LLM orchestration). API key in the Secret.
      # Requires outbound egress to api.anthropic.com (or AWS Bedrock).
      # Air-gapped without an external LLM is NOT supported yet.
      # See docs/03-agent-setup.md.
      [agent]
      backend = "anthropic"
      provider = "anthropic"
      managed_emails = ["*@yourcompany.com"]
      model_big = "claude-opus-4-8"
      model_normal = "claude-sonnet-4-6"
      model_small = "claude-haiku-4-5"
      public_model_id = "skore-agent"

      # CORS — restrict to the frontend origin.
      [cors]
      allow_origins = ["https://skore-hub.example.com"]
      allow_credentials = true

      # Cross-site cookies: the SPA (skore-hub.example.com) and the API
      # (api.skore-hub.example.com) are different origins, so session cookies
      # must be SameSite=None and Secure (HTTPS).
      [cookie]
      samesite = "none"
      secure = true

  # Sensitive values, mapped from the Secret named in skh.envSecret.
  extraEnv:
    # Signs cookie-based session state. Without it the backend generates a new
    # random key at every pod start, so sessions break on restart and are not
    # shared between replicas.
    - name: SKH__SESSION_SECRET_KEY
      valueFrom:
        {
          secretKeyRef:
            { name: skore-hub-backend-secrets, key: session-secret-key },
        }
    - name: SKH__DB__USER
      valueFrom:
        { secretKeyRef: { name: skore-hub-backend-secrets, key: db-user } }
    - name: SKH__DB__PASSWORD
      valueFrom:
        { secretKeyRef: { name: skore-hub-backend-secrets, key: db-password } }
    - name: SKH__IDP__CLIENT_ID
      valueFrom:
        {
          secretKeyRef: { name: skore-hub-backend-secrets, key: idp-client-id },
        }
    - name: SKH__IDP__CLIENT_SECRET
      valueFrom:
        {
          secretKeyRef:
            { name: skore-hub-backend-secrets, key: idp-client-secret },
        }
    - name: SKH__OBJECT_STORAGE__ACCESS_KEY
      valueFrom:
        {
          secretKeyRef: { name: skore-hub-backend-secrets, key: s3-access-key },
        }
    - name: SKH__OBJECT_STORAGE__SECRET_KEY
      valueFrom:
        {
          secretKeyRef: { name: skore-hub-backend-secrets, key: s3-secret-key },
        }
    - name: SKH__REDIS__PASSWORD
      valueFrom:
        {
          secretKeyRef:
            { name: skore-hub-backend-secrets, key: redis-password },
        }
    - name: SKH__SMTP__USER
      valueFrom:
        { secretKeyRef: { name: skore-hub-backend-secrets, key: smtp-user } }
    - name: SKH__SMTP__PASSWORD
      valueFrom:
        {
          secretKeyRef: { name: skore-hub-backend-secrets, key: smtp-password },
        }

    # Skore agent: encryption key (required for per-workspace providers) and
    # the Skore-managed Anthropic key (only for the Skore-managed model). For
    # Bedrock static creds / cross-account assume-role, add the matching keys
    # (aws-access-key-id, aws-secret-access-key, bedrock-external-id) here.
    - name: SKH__ENCRYPTION__KEY
      valueFrom:
        {
          secretKeyRef:
            { name: skore-hub-backend-secrets, key: encryption-key },
        }
    - name: SKH__AGENT__ANTHROPIC_API_KEY
      valueFrom:
        {
          secretKeyRef:
            { name: skore-hub-backend-secrets, key: anthropic-api-key },
        }

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.skore-hub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: skore-hub-api-tls
      hosts:
        - api.skore-hub.example.com

resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    memory: 4Gi
