site_name: skore-hub Deployment Guide
site_description: Deploy and operate the skore-hub platform on Kubernetes.
# The mike plugin appends the deployed documentation version (dev, or the
# chart version) to this URL when publishing, so canonical URLs, Open Graph
# tags and sitemap entries point at the exact documentation version.
site_url: https://probabl-ai.github.io/charts/docs/
docs_dir: docs
use_directory_urls: true
# Fail the build (and therefore the publication) on warnings.
strict: true

repo_url: https://github.com/probabl-ai/charts
repo_name: probabl-ai/charts
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  # mike injects this plugin automatically on `mike deploy`; listing it
  # explicitly makes versioned builds behave identically outside of mike (and
  # lets the docs CI check catch a malformed versioned canonical URL).
  - mike

# mkdocs-material does not bundle the mermaid library: by default its JavaScript
# fetches https://unpkg.com/mermaid@11/dist/mermaid.min.js at page-view time,
# and diagrams degrade to their raw text source when that CDN is unreachable
# (corporate proxies, ad blockers, air-gapped machines). Defining `window.mermaid`
# ourselves makes material skip its CDN load, so diagrams render from the
# self-hosted copy below. Keep it in sync with what the theme expects (mermaid
# 11.x); update with e.g.:
#   curl -L https://unpkg.com/mermaid@11/dist/mermaid.min.js \
#     -o docs/assets/mermaid/mermaid.min.js   # currently vendored: 11.17.2
extra_javascript:
  - assets/mermaid/mermaid.min.js

# Render the version selector from the `versions.json` written by mike. The
# `dev` version tracks the main branch; numbered versions are chart releases.
extra:
  version:
    provider: mike

nav:
  - Overview: README.md
  - Installation: 01-installation.md
  - Operations: 02-operations.md
  - Agent setup: 03-agent-setup.md
  - Configuration reference: reference-configuration.md
