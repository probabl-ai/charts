name: Release charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

# Serialize with the docs workflow: both push to the gh-pages branch and must
# not run at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          # Serve the .tgz packages from the gh-pages branch (not as private
          # release assets), so `helm repo add` works anonymously on a private
          # repository.
          packages_with_index: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
